name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11"

jobs:
  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        # setup-node@v4 installs pnpm automatically from the packageManager
        # field in package.json (pnpm/action-setup was deprecated and breaks
        # on fresh runners).
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck libraries
        run: pnpm run typecheck:libs

      - name: Typecheck worker API
        working-directory: ./workers-api
        run: pnpm exec tsc --noEmit

      - name: Typecheck frontend
        working-directory: ./artifacts/swiftjob-systems
        run: pnpm exec tsc -p tsconfig.json --noEmit

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        # setup-node@v4 installs pnpm automatically from the packageManager
        # field in package.json (pnpm/action-setup was deprecated and breaks
        # on fresh runners).
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: ./artifacts/swiftjob-systems
        run: pnpm run build

  deploy-worker:
    name: Deploy Worker API
    runs-on: ubuntu-latest
    needs: typecheck
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        # setup-node@v4 installs pnpm automatically from the packageManager
        # field in package.json (pnpm/action-setup was deprecated and breaks
        # on fresh runners).
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        working-directory: ./workers-api
        run: pnpm install --frozen-lockfile

      - name: Publish Worker with wrangler
        working-directory: ./workers-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Set Worker secrets
        working-directory: ./workers-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          HR_EMAIL: ${{ secrets.HR_EMAIL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          for var in DATABASE_URL RESEND_API_KEY EMAIL_FROM HR_EMAIL JWT_SECRET ADMIN_EMAIL ADMIN_PASSWORD; do
            value="$(printenv "$var")"
            if [ -n "$value" ]; then
              printf '%s' "$value" | pnpm exec wrangler secret put "$var" --name swiftjob-workers-api || true
            fi
          done

  deploy-pages:
    name: Deploy Frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [build-frontend]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        # setup-node@v4 installs pnpm automatically from the packageManager
        # field in package.json (pnpm/action-setup was deprecated and breaks
        # on fresh runners).
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: ./artifacts/swiftjob-systems
        run: pnpm run build

      - name: Deploy to Cloudflare Pages
        working-directory: ./artifacts/swiftjob-systems
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy dist/public --project-name=swiftjob-systems
