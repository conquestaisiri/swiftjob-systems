name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.18.0"

jobs:
  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck libraries
        run: pnpm run typecheck:libs

      - name: Typecheck worker API
        working-directory: ./workers-api
        run: pnpm exec tsc --noEmit

      - name: Typecheck frontend
        working-directory: ./artifacts/swiftjob-systems
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Run isolated workflow regressions
        run: |
          pnpm --dir AUDIT/runtime install --lockfile=false --ignore-workspace
          node AUDIT/runtime/auth-regression.mjs
          node AUDIT/runtime/application-regression.mjs
          node AUDIT/runtime/techcheck-regression.mjs
          node AUDIT/runtime/email-unsubscribe-regression.mjs
          pnpm --filter @workspace/scripts exec tsx --test ../shared/mail-recipients.test.ts ../shared/application-questions.test.ts ../workers-api/src/services/assessmentAccess.test.ts ../workers-api/src/services/adminLogin.test.ts ../workers-api/src/services/email.test.ts ../workers-api/src/services/emailUnsubscribe.test.ts ../workers-api/src/services/emailDelivery.test.ts

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: ./artifacts/swiftjob-systems
        run: pnpm run build

  deploy-worker:
    name: Deploy Worker API
    runs-on: ubuntu-latest
    needs: typecheck
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        working-directory: ./workers-api
        run: pnpm install --frozen-lockfile

      - name: Ensure a monitoring DMARC record exists for swiftjob.online
        env:
          CLOUDFLARE_DNS_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.SWIFTJOB_CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_DNS_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ZONE_ID:-}" ]; then
            echo "::warning::Scoped Cloudflare DNS credentials are unavailable; DMARC DNS was not changed."
            exit 0
          fi

          auth_header="Authorization: Bearer ${CLOUDFLARE_DNS_API_TOKEN}"
          zone_id="$CLOUDFLARE_ZONE_ID"
          records="$(curl --silent --show-error --fail --header "$auth_header" \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?type=TXT&name=_dmarc.swiftjob.online" 2>/dev/null || true)"
          if [ -z "$records" ]; then
            echo "::warning::The scoped DNS token cannot inspect swiftjob.online DMARC; the record remains unchanged."
            exit 0
          fi
          record_count="$(jq -r '.result | length' <<< "$records" 2>/dev/null || printf '0')"
          if [ "$record_count" -gt 0 ]; then
            if [ "$record_count" -ne 1 ]; then
              echo "::warning::Multiple DMARC TXT records exist; none were changed."
              exit 0
            fi

            record_id="$(jq -r '.result[0].id // empty' <<< "$records")"
            content="$(jq -r '.result[0].content // empty' <<< "$records")"
            if grep -Eiq '(^|;[[:space:]]*)rua=' <<< "$content"; then
              echo "DMARC aggregate reporting is already configured."
              exit 0
            fi
            if ! grep -Eiq '^v=DMARC1([;[:space:]]|$)' <<< "$content" || [ -z "$record_id" ]; then
              echo "::warning::The existing DMARC record is malformed or unidentified; it was left unchanged."
              exit 0
            fi

            content="${content}; rua=mailto:dmarc@swiftjob.online"
            payload="$(jq -n --arg content "$content" '{content:$content}')"
            updated="$(curl --silent --show-error --fail --request PATCH \
              --header "$auth_header" --header 'Content-Type: application/json' \
              --data "$payload" \
              "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records/${record_id}" 2>/dev/null || true)"
            if [ "$(jq -r '.success // false' <<< "$updated" 2>/dev/null || true)" = "true" ]; then
              echo "Added aggregate reporting to the existing DMARC record without changing its policy."
            else
              echo "::warning::Cloudflare could not add DMARC aggregate reporting; the existing record was retained."
            fi
            exit 0
          fi

          payload="$(jq -n --arg name '_dmarc.swiftjob.online' \
            --arg content 'v=DMARC1; p=none; rua=mailto:dmarc@swiftjob.online; adkim=r; aspf=r' \
            '{type:"TXT",name:$name,content:$content,ttl:3600}')"
          created="$(curl --silent --show-error --fail --request POST \
            --header "$auth_header" --header 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records" 2>/dev/null || true)"
          if [ "$(jq -r '.success // false' <<< "$created" 2>/dev/null || true)" = "true" ]; then
            echo "Created the .online DMARC monitoring record with aggregate reports (p=none)."
          else
            echo "::warning::Cloudflare DNS write access is unavailable; DMARC record was not created."
          fi

      - name: Apply email unsubscribe migration
        working-directory: ./workers-api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node migrate.mjs migrations/017_email_unsubscriptions.sql

      - name: Apply email delivery monitoring migration
        working-directory: ./workers-api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node migrate.mjs migrations/018_email_delivery_events.sql

      - name: Publish Worker with wrangler
        working-directory: ./workers-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Set Worker secrets
        working-directory: ./workers-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          HR_EMAIL: ${{ secrets.HR_EMAIL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          for var in DATABASE_URL RESEND_API_KEY EMAIL_FROM HR_EMAIL JWT_SECRET ADMIN_EMAIL ADMIN_PASSWORD; do
            value="$(printenv "$var")"
            if [ -n "$value" ]; then
              printf '%s' "$value" | pnpm exec wrangler secret put "$var" --name swiftjob-workers-api
            else
              echo "Required deployment secret $var is missing" >&2
              exit 1
            fi
          done
          if [ -n "${ADMIN_USERNAME:-}" ]; then
            printf '%s' "$ADMIN_USERNAME" | pnpm exec wrangler secret put ADMIN_USERNAME --name swiftjob-workers-api
          fi
          if [ -n "${RESEND_WEBHOOK_SECRET:-}" ]; then
            printf '%s' "$RESEND_WEBHOOK_SECRET" | pnpm exec wrangler secret put RESEND_WEBHOOK_SECRET --name swiftjob-workers-api
          fi

  deploy-pages:
    name: Deploy Frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [build-frontend]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: ./artifacts/swiftjob-systems
        run: pnpm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --dir workers-api exec wrangler pages deploy ../artifacts/swiftjob-systems/dist/public --project-name=swiftjob-systems
