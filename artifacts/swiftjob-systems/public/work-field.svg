<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="Facilities and cleaning staff">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081526"/>
      <stop offset="1" stop-color="#0B1F33"/>
    </linearGradient>
  </defs>
  <rect width="640" height="420" fill="url(#bg2)"/>
  <g opacity="0.5">
    <circle cx="600" cy="70" r="150" fill="#5FDCC4"/>
    <circle cx="70" cy="390" r="120" fill="#5FDCC4"/>
  </g>

  <!-- window shine panel -->
  <rect x="60" y="60" width="230" height="230" rx="10" fill="#2A435E" opacity="0.9"/>
  <rect x="60" y="60" width="230" height="60" rx="10" fill="#2A435E" href="#none"/>
  <line x1="60" y1="118" x2="290" y2="118" stroke="#0B1F33" stroke-width="6"/>
  <path d="M95 100 q70 40 150 10" stroke="#7FD8C4" stroke-width="8" fill="none" opacity="0.8"/>
  <path d="M100 165 q60 30 130 8" stroke="#7FD8C4" stroke-width="7" fill="none" opacity="0.55"/>
  <path d="M110 225 q55 25 115 6" stroke="#7FD8C4" stroke-width="6" fill="none" opacity="0.4"/>

  <!-- floor -->
  <rect x="0" y="330" width="640" height="90" fill="#0E8372" opacity="0.25"/>
  <line x1="0" y1="372" x2="640" y2="372" stroke="#081526" stroke-width="3"/>

  <!-- person -->
  <circle cx="430" cy="130" r="32" fill="#F0C69B"/>
  <rect x="410" y="160" width="40" height="70" rx="16" fill="#0E8372"/>
  <path d="M414 168 q-50 12 -70 44" stroke="#0E8372" stroke-width="20" stroke-linecap="round" fill="none"/>
  <!-- cleaning tool (bucket + handle) -->
  <rect x="336" y="200" width="44" height="58" rx="8" fill="#C89B6C"/>
  <rect x="336" y="200" width="44" height="14" rx="8" fill="#B07F4E"/>
  <line x1="356" y1="200" x2="356" y2="120" stroke="#7A5C32" stroke-width="7" stroke-linecap="round"/>

  <!-- legs -->
  <rect x="416" y="228" width="14" height="56" rx="8" fill="#0E8372"/>
  <rect x="470" y="228" width="14" height="56" rx="8" fill="#0E8372"/>

  <!-- bucket & mop on floor -->
  <ellipse cx="540" cy="330" rx="30" ry="12" fill="#E4F4F1" opacity="0.9"/>
  <rect x="516" y="300" width="48" height="34" rx="8" fill="#E4F4F1"/>
  <ellipse cx="540" cy="300" rx="24" ry="8" fill="#F7F5F0"/>

  <text x="600" y="405" font-family="Inter, sans-serif" font-size="13" fill="#5FDCC4" text-anchor="end" letter-spacing="1">FACILITIES &amp; FIELD</text>
</svg>