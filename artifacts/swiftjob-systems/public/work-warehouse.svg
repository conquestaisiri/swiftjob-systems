<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="Warehouse and packing workers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F33"/>
      <stop offset="1" stop-color="#081526"/>
    </linearGradient>
  </defs>
  <rect width="640" height="420" fill="url(#bg)"/>
  <g opacity="0.5">
    <circle cx="70" cy="70" r="140" fill="#5FDCC4"/>
    <circle cx="600" cy="380" r="160" fill="#5FDCC4"/>
  </g>

  <!-- shelves -->
  <rect x="60" y="120" width="200" height="220" rx="8" fill="#0E8372" opacity="0.35"/>
  <rect x="60" y="120" width="200" height="46" fill="#0E8372" opacity="0.5"/>
  <rect x="60" y="207" width="200" height="46" fill="#0E8372" opacity="0.5"/>
  <rect x="60" y="294" width="200" height="46" fill="#0E8372" opacity="0.5"/>
  <!-- boxes on shelves -->
  <rect x="76" y="134" width="52" height="38" rx="5" fill="#F7F5F0"/>
  <rect x="140" y="134" width="52" height="38" rx="5" fill="#E4F4F1"/>
  <rect x="76" y="221" width="52" height="38" rx="5" fill="#E4F4F1"/>
  <rect x="140" y="221" width="52" height="38" rx="5" fill="#F7F5F0"/>

  <!-- person packing box on table -->
  <rect x="380" y="260" width="180" height="26" rx="6" fill="#2A435E"/>
  <!-- legs -->
  <rect x="392" y="286" width="14" height="60" rx="4" fill="#2A435E"/>
  <rect x="534" y="286" width="14" height="60" rx="4" fill="#2A435E"/>
  <!-- box on table -->
  <rect x="398" y="226" width="92" height="40" rx="5" fill="#C89B6C"/>
  <rect x="398" y="226" width="92" height="10" rx="5" fill="#B07F4E"/>
  <!-- person -->
  <circle cx="470" cy="120" r="34" fill="#F0C69B"/>
  <rect x="448" y="152" width="44" height="70" rx="18" fill="#0E8372"/>
  <rect x="452" y="216" width="16" height="70" rx="8" fill="#0E8372"/>
  <rect x="508" y="216" width="16" height="70" rx="8" fill="#0E8372"/>
  <path d="M470 150 q40 0 60 26" stroke="#0E8372" stroke-width="22" stroke-linecap="round" fill="none"/>
  <!-- box being held -->
  <rect x="512" y="200" width="46" height="40" rx="6" fill="#E7F4F1"/>

  <!-- floor crate -->
  <rect x="60" y="350" width="90" height="50" rx="6" fill="#F4E3D0"/>
  <rect x="190" y="358" width="70" height="42" rx="6" fill="#D9E8F2"/>

  <text x="600" y="405" font-family="Inter, sans-serif" font-size="13" fill="#5FDCC4" text-anchor="end" letter-spacing="1">WAREHOUSE &amp; LOGISTICS</text>
</svg>