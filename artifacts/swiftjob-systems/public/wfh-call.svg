<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-label="A laptop showing a remote team video call">
  <!-- backdrop -->
  <rect width="800" height="520" fill="#10251d"/>
  <circle cx="690" cy="70" r="150" fill="#1b3529"/>
  <circle cx="90" cy="470" r="120" fill="#1b3529"/>
  <!-- laptop -->
  <g>
    <rect x="180" y="90" width="440" height="290" rx="16" fill="#22382f"/>
    <rect x="194" y="104" width="412" height="262" rx="8" fill="#f5f7f3"/>
    <!-- call grid -->
    <g>
      <rect x="212" y="122" width="126" height="96" rx="10" fill="#e7efe6"/>
      <circle cx="275" cy="160" r="22" fill="#c98a6b"/>
      <path d="M247 218 q28 -34 56 0 z" fill="#5f9467"/>
      <rect x="212" y="196" width="60" height="14" rx="7" fill="#ffffff" opacity=".85"/>
    </g>
    <g>
      <rect x="350" y="122" width="126" height="96" rx="10" fill="#efe9dd"/>
      <circle cx="413" cy="160" r="22" fill="#8a5a3b"/>
      <path d="M385 218 q28 -36 56 0 z" fill="#b4552d"/>
      <rect x="350" y="196" width="60" height="14" rx="7" fill="#ffffff" opacity=".85"/>
    </g>
    <g>
      <rect x="488" y="122" width="100 " height="96" rx="10" fill="#dde7f5"/>
      <circle cx="538" cy="158" r="20" fill="#e0b089"/>
      <path d="M512 216 q26 -32 52 0 z" fill="#3f6ea5"/>
      <rect x="498" y="140" width="18" height="12" rx="4" fill="#d4e94e"/>
    </g>
    <!-- speaker bar -->
    <rect x="212" y="236" width="376" height="112" rx="12" fill="#10251d"/>
    <circle cx="270" cy="292" r="30" fill="#e9c46a"/>
    <path d="M240 322 q30 -40 60 0 z" fill="#7a5230"/>
    <rect x="318" y="266" width="180" height="10" rx="5" fill="#dff3e1"/>
    <rect x="318" y="286" width="230" height="10" rx="5" fill="#bcdcbd"/>
    <rect x="318" y="306" width="140" height="10" rx="5" fill="#bcdcbd"/>
  </g>
  <!-- base -->
  <rect x="130" y="380" width="540" height="18" rx="9" fill="#0d1d15"/>
  <rect x="360" y="398" width="80" height="10" rx="5" fill="#0d1d15"/>
</svg>
