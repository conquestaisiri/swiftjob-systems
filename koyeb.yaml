version: 1
services:
  - name: api
    git:
      repository: https://github.com/conquestaisiri/swiftjob-systems
      branch: main
    build:
      type: dockerfile
      dockerfile: artifacts/api-server/Dockerfile
    env:
      - name: DATABASE_URL
        value: ${{secrets.DATABASE_URL}}
      - name: JWT_SECRET
        value: ${{secrets.JWT_SECRET}}
      - name: RESEND_API_KEY
        value: ${{secrets.RESEND_API_KEY}}
      - name: EMAIL_FROM
        value: ${{secrets.EMAIL_FROM}}
      - name: HR_EMAIL
        value: ${{secrets.HR_EMAIL}}
      - name: R2_ACCOUNT_ID
        value: ${{secrets.R2_ACCOUNT_ID}}
      - name: R2_ACCESS_KEY_ID
        value: ${{secrets.R2_ACCESS_KEY_ID}}
      - name: R2_SECRET_ACCESS_KEY
        value: ${{secrets.R2_SECRET_ACCESS_KEY}}
      - name: R2_BUCKET
        value: ${{secrets.R2_BUCKET}}
      - name: R2_ENDPOINT
        value: ${{secrets.R2_ENDPOINT}}
      - name: R2_PUBLIC_URL
        value: ${{secrets.R2_PUBLIC_URL}}
      - name: ADMIN_EMAIL
        value: ${{secrets.ADMIN_EMAIL}}
      - name: ADMIN_PASSWORD
        value: ${{secrets.ADMIN_PASSWORD}}
      - name: NODE_ENV
        value: production
      - name: PORT
        value: "8080"
      - name: FRONTEND_URL
        value: ${{secrets.FRONTEND_URL}}
    ports:
      - port: 8080
        protocol: http
    routes:
      - path: /
    regions:
      - frankfurt
